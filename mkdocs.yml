site_name: Factory
site_description: Config-driven agent factories for Claude Code — PO, DEV, QA and CR.
site_url: https://correaschneider.github.io/ai-factory/
repo_url: https://github.com/correaschneider/ai-factory
repo_name: correaschneider/ai-factory
edit_uri: edit/main/docs/
copyright: MIT · Pedro Schneider

theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt
          name: Português
          build: true
          site_description: Fábricas de agentes config-driven para Claude Code — PO, DEV, QA e CR.
          nav_translations:
            Home: Início
            Getting started: Começando
            Concepts: Conceitos
            Factories: Fábricas
            Reference: Referência
            Configuration: Configuração
            Drivers: Drivers
            Models per role: Modelos por papel
            FAQ: Perguntas frequentes
            Privacy policy: Política de privacidade
            Terms of use: Termos de uso

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Factories:
      - factories/demo.md
      - factories/init.md
      - factories/po.md
      - factories/dev.md
      - factories/qa.md
      - factories/cr.md
  - Reference:
      - Configuration: reference/config.md
      - Drivers: reference/drivers.md
      - Models per role: reference/models.md
  - FAQ: faq.md
  - Legal:
      - Privacy policy: privacy.md
      - Terms of use: terms.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
